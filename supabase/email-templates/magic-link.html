<!--
  Paste into: Supabase Dashboard → Authentication → Email Templates → "Magic Link"
  Available vars: {{ .ConfirmationURL }} · {{ .Email }} · {{ .Token }} · {{ .SiteURL }}
-->
<!doctype html>
<html lang="fr">
  <body style="margin:0;background:#0b0b0e;color:#edeae3;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:32px 0;">
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:520px;margin:0 auto;background:#101015;border:1px solid rgba(255,255,255,0.06);border-radius:16px;">
      <tr>
        <td style="padding:32px 24px;">
          <p style="font-size:12px;font-weight:600;letter-spacing:0.18em;color:#6d4dff;margin:0;text-transform:uppercase;">VOIDCRAFT</p>
          <h1 style="font-size:26px;font-weight:600;margin:8px 0 16px;color:#fafafa;">Ton lien de connexion.</h1>
          <p style="font-size:15px;line-height:1.6;margin:0 0 12px;color:#c9c7c1;">
            Salut,
          </p>
          <p style="font-size:15px;line-height:1.6;margin:0 0 12px;color:#c9c7c1;">
            Clique sur le bouton pour te connecter à VOIDCRAFT. Pas besoin de mot de passe. Le lien expire dans 1h.
          </p>
          <p style="margin:24px 0;">
            <a href="{{ .ConfirmationURL }}" style="background:#6d4dff;color:#ffffff;font-size:14px;font-weight:500;padding:12px 20px;border-radius:10px;text-decoration:none;display:inline-block;">
              Me connecter
            </a>
          </p>
          <p style="font-size:13px;line-height:1.6;margin:0 0 8px;color:#8b8780;">
            Le bouton ne marche pas ? Copie ce lien dans ton navigateur :
          </p>
          <p style="font-size:12px;line-height:1.6;word-break:break-all;margin:0;color:#6d4dff;">
            {{ .ConfirmationURL }}
          </p>
          <hr style="border:none;border-top:1px solid rgba(255,255,255,0.08);margin:24px 0 16px;" />
          <p style="font-size:12px;color:#6b6862;margin:0;">
            Si tu n'as pas demandé ce lien, ignore cet email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
